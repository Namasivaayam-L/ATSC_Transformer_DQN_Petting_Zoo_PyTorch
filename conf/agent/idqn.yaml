# IDQN (Independent DQN) — Phase 1 agent. MLP Q-network, no transformer.
# All Phase 0/1 RL hyperparameters come from the top-level config; this file
# only describes the *agent* (network shape + behaviour).

name: idqn
type: learned

network:
  type: mlp
  hidden_sizes: [128, 128]
  activation: relu
  dueling: ${dueling}
